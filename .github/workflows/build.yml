name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Сначала только jar мода: его можно скачать, даже если тесты потом упадут.
      - name: Сборка мода
        run: ./gradlew remapJar --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: olegus-arrow
          path: build/libs/olegus-arrow-*.jar

      - name: Полная сборка
        run: ./gradlew build --stacktrace

      - name: Игровые тесты
        run: ./gradlew runGametest --stacktrace
