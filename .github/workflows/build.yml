name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew build --stacktrace

      # Готовый мод выкладывается до тестов, чтобы его можно было скачать в любом случае.
      - uses: actions/upload-artifact@v4
        with:
          name: olegus-arrow
          path: build/libs/olegus-arrow-*.jar

      - name: Игровые тесты
        run: ./gradlew runGametest --stacktrace
