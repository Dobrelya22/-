name: update-video

# Апдейт-ролик «как было — как стало», около двух минут. Снимает дубли в игре (сценарий update
# в src/demo, список — tools/demo/update-takes.txt), озвучивает фразы tools/demo/update/narration.txt
# и монтирует ролик tools/demo/update/montage.py. Готовый ролик и исходники для перемонтажа —
# в релизе «update». Дубли снимаются заново, только если изменился сценарий или их ещё нет.
on:
  workflow_dispatch:
    inputs:
      record:
        description: 'Снять дубли заново (иначе берутся из релиза «update»)'
        type: boolean
        default: false
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/update-video.yml
      - tools/demo/update/**
      - tools/demo/update-takes.txt
      - tools/demo/sound_track.py
      - tools/demo/record.sh
      - src/demo/**

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      record: ${{ steps.plan.outputs.record }}
      montage: ${{ steps.plan.outputs.montage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          INPUT_RECORD: ${{ inputs.record }}
        run: |
          record=false
          if ! gh release view update --json assets --jq '.assets[].name' 2>/dev/null | grep -qx raw-video.mp4; then
            record=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            record=$INPUT_RECORD
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null) || changed=src/demo/
            grep -qE '^(src/demo/|tools/demo/(update-takes\.txt|sound_track\.py|record\.sh))' <<<"$changed" && record=true
          fi
          montage=false
          [ -f tools/demo/update/montage.py ] && [ -f tools/demo/update/narration.txt ] && montage=true
          echo "Снимать дубли: $record, монтировать: $montage"
          echo "record=$record" >> "$GITHUB_OUTPUT"
          echo "montage=$montage" >> "$GITHUB_OUTPUT"

  record:
    needs: plan
    if: needs.plan.outputs.record == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEMO_SCENARIO: update
      DEMO_DILATION: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Пакеты для записи
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg libgl1-mesa-dri mesa-utils
          pip install numpy

      - name: Съёмка дублей
        run: |
          mkdir -p build
          # Флейта из 1.2.1 — для дорожки «как было».
          git show v1.2.1:src/main/resources/assets/andryushka_arrow/sounds/flight.ogg > build/flight-1.2.1.ogg
          DEMO_OLD_FLIGHT=build/flight-1.2.1.ogg tools/demo/record.sh build/update

      - name: Кадры для проверки
        if: always()
        run: |
          for t in $(seq 1 6 104); do
            if ffmpeg -loglevel error -y -ss "$t" -i build/update/video.mp4 -frames:v 1 -vf scale=480:-2 -q:v 8 /tmp/frame.jpg; then
              echo "FRAME $t $(base64 -w0 /tmp/frame.jpg)"
            fi
          done
          grep -E "ERROR|Exception|Демо" build/update/latest.log | head -60 || true

      - name: Исходники в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw
          cp build/update/video.mp4 raw/raw-video.mp4
          cp build/update/sfx.wav raw/raw-sfx.wav
          cp build/update/sfx-before.wav raw/raw-sfx-before.wav
          cp build/update/demo-sounds.txt raw/raw-sounds.txt
          cp build/update/demo-markers.txt raw/raw-markers.txt
          cp build/update/dilation.txt raw/raw-dilation.txt
          gh release view update >/dev/null 2>&1 || gh release create update --prerelease --target "$GITHUB_SHA" \
            --title "Апдейт-ролик «Стрела Андрюшки» 1.3.0" \
            --notes "Апдейт-ролик «как было — как стало». Голос — Silero TTS (CC BY-NC 4.0), только для некоммерческого использования."
          gh release upload update raw/* --clobber

  narration:
    needs: plan
    if: needs.plan.outputs.montage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Закадровый голос
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p narration
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          curl -sSfL -o silero.pt https://models.silero.ai/models/tts/ru/v5_6_ru.pt
          python tools/demo/narration.py --engine silero --model silero.pt --speaker xenia --voice anime \
            tools/demo/update/narration.txt narration/narration.wav
          cat narration/narration-timing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: update-narration
          path: narration/

  montage:
    needs: [plan, record, narration]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.montage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: update-narration
          path: narration

      - name: Монтаж
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy pillow opencv-python-headless
          mkdir -p raw dist
          gh release download update --pattern 'raw-*' --dir raw
          python tools/demo/update/montage.py raw narration dist/andryushka-arrow-update-720p60.mp4
          # Лёгкая версия — чтобы удобно переслать.
          for pass in 1 2; do
            output=dist/andryushka-arrow-update-540p60.mp4; [ "$pass" = 1 ] && output=/dev/null
            ffmpeg -loglevel error -y -i dist/andryushka-arrow-update-720p60.mp4 -vf scale=960:-2 -r 60 \
              -c:v libx264 -preset slow -b:v 2200k -pass "$pass" -pix_fmt yuv420p \
              -c:a aac -b:a 160k -movflags +faststart -f mp4 "$output"
          done
          cp narration/narration.wav raw/raw-narration.wav
          cp narration/narration-timing.txt raw/raw-narration-timing.txt
          ls -l dist

      - name: Кадры для проверки
        run: |
          for t in $(seq 1 5 150); do
            if ffmpeg -loglevel error -y -ss "$t" -i dist/andryushka-arrow-update-720p60.mp4 -frames:v 1 -vf scale=480:-2 -q:v 8 /tmp/frame.jpg; then
              echo "FRAME $t $(base64 -w0 /tmp/frame.jpg)"
            fi
          done

      - name: В релиз и на файлообменник
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload update dist/*.mp4 raw/raw-narration.wav raw/raw-narration-timing.txt --clobber
          for f in dist/*.mp4; do
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/update/$(basename "$f")"
          done
          reply=$(curl -sS --connect-timeout 20 --max-time 1500 -F "file=@dist/andryushka-arrow-update-540p60.mp4" \
                    https://upload.gofile.io/uploadfile || true)
          echo "gofile: $reply"
          page=$(jq -r '.data.downloadPage // empty' <<<"$reply" 2>/dev/null || true)
          [ -n "$page" ] && echo "### Апдейт-ролик: $page" >> "$GITHUB_STEP_SUMMARY" && echo "Ссылка: $page"
