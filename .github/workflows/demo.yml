name: demo

# Записывает демонстрационный ролик мода: настоящий клиент Minecraft на виртуальном экране,
# 60 кадров в секунду, звуки игры и закадровый голос. Запись идёт около 40 минут, поэтому
# запускается вручную: Actions → demo → Run workflow.
on:
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Закадровый голос
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install piper-tts==1.2.0 numpy
          for ref in v1.0.0 main; do
            base=https://huggingface.co/rhasspy/piper-voices/resolve/$ref/ru/ru_RU/ruslan/medium
            curl -sSfL -o voice.onnx "$base/ru_RU-ruslan-medium.onnx" \
              && curl -sSfL -o voice.onnx.json "$base/ru_RU-ruslan-medium.onnx.json" && break
          done
          python tools/demo/narration.py voice.onnx tools/demo/narration.txt narration.wav

      - uses: actions/upload-artifact@v4
        with:
          name: andryushka-arrow-narration
          path: narration.wav

  record:
    needs: narration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DEMO_DILATION: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Пакеты для записи
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg libgl1-mesa-dri mesa-utils
          pip install numpy

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: andryushka-arrow-narration
          path: narration

      - name: Запись ролика
        run: tools/demo/record.sh build/demo narration/narration.wav

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andryushka-arrow-demo
          path: build/demo/

      # Несколько кадров прямо в логе — чтобы проверить ролик, не скачивая его.
      - name: Кадры для проверки
        if: always()
        run: |
          for t in 1 5 12 16.5 19 24 29 32 34 39 46 53 57 63 70 76 81 85 88 90 95; do
            if ffmpeg -loglevel error -y -ss "$t" -i build/demo/andryushka-arrow-demo.mp4 -frames:v 1 \
                 -vf scale=640:-2 -q:v 7 /tmp/frame.jpg; then
              echo "FRAME $t $(base64 -w0 /tmp/frame.jpg)"
            fi
          done

      - name: Журнал игры
        if: always()
        run: grep -E "ERROR|Exception|andryushka|Демо" build/demo/latest.log | head -150 || true

  # Облегчённая копия ролика текстом в логах: её можно забрать без доступа к хранилищу артефактов.
  compress:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: andryushka-arrow-demo
          path: demo

      - name: Сжатие до 20 МБ
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 demo/andryushka-arrow-demo.mp4)
          video_kbps=$(python3 -c "print(int(20 * 8 * 1024 * 1024 / $duration / 1000) - 128)")
          for pass in 1 2; do
            output=small.mp4; [ "$pass" = 1 ] && output=/dev/null
            ffmpeg -loglevel error -y -i demo/andryushka-arrow-demo.mp4 -vf scale=960:-2 -r 60 \
              -c:v libx264 -preset slow -b:v "${video_kbps}k" -pass "$pass" -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart -f mp4 "$output"
          done
          ls -l small.mp4
          sha256sum small.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: andryushka-arrow-demo-small
          path: small.mp4

  share:
    needs: compress
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: andryushka-arrow-demo-small

      - name: Часть ролика в логе
        run: |
          size=$(stat -c %s small.mp4)
          chunk=$(( (size + 4) / 5 ))
          offset=$(( ${{ matrix.part }} * chunk ))
          length=$(( size - offset < chunk ? size - offset : chunk ))
          echo "VIDEO-BEGIN ${{ matrix.part }} $offset $length $size"
          tail -c +$(( offset + 1 )) small.mp4 | head -c "$length" | base64 -w 60000 | sed 's/^/VIDEO /'
          echo "VIDEO-END"
