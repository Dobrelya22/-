name: demo

# Записывает обзорный ролик мода: настоящий клиент Minecraft на виртуальном экране, 60 кадров
# в секунду, звуки игры и закадровый голос. Запись долгая (около часа на 10 минут ролика), поэтому
# запускается вручную: Actions → demo → Run workflow. Готовый ролик выкладывается в релиз «review».
on:
  workflow_dispatch:
    inputs:
      dilation:
        description: 'Во сколько раз замедлить игру при записи (больше — дольше запись, а всплывающие достижения короче)'
        default: '3'
      capture_fps:
        description: 'Кадров в секунду при захвате экрана (пусто — ровно 60 / замедление)'
        default: ''
      publish:
        description: 'Выложить ролик в релиз «review»'
        type: boolean
        default: true

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Закадровый голос
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p narration
          pip install numpy
          # Основной голос — Silero (xenia), запасной — Piper (irina).
          if pip install torch --index-url https://download.pytorch.org/whl/cpu \
              && curl -sSfL -o silero.pt https://models.silero.ai/models/tts/ru/v5_6_ru.pt \
              && python tools/demo/narration.py --engine silero --model silero.pt --speaker xenia --voice anime \
                   tools/demo/narration.txt narration/narration.wav; then
            echo "Голос: Silero xenia"
          else
            pip install piper-tts==1.2.0
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium
            curl -sSfL -o voice.onnx "$base/ru_RU-irina-medium.onnx"
            curl -sSfL -o voice.onnx.json "$base/ru_RU-irina-medium.onnx.json"
            python tools/demo/narration.py --engine piper --model voice.onnx --voice anime \
              tools/demo/narration.txt narration/narration.wav
            echo "Голос: Piper irina"
          fi
          cat narration/narration-timing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: andryushka-arrow-narration
          path: narration/

  record:
    needs: narration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DEMO_DILATION: ${{ inputs.dilation }}
      DEMO_CAPTURE_FPS: ${{ inputs.capture_fps }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Пакеты для записи
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg libgl1-mesa-dri mesa-utils
          pip install numpy

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: andryushka-arrow-narration
          path: narration

      - name: Запись ролика
        run: tools/demo/record.sh build/demo narration/narration.wav narration/narration-timing.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andryushka-arrow-demo
          path: build/demo/

      # Кадры каждые 20 секунд прямо в логе — чтобы проверить ролик, не скачивая его.
      - name: Кадры для проверки
        if: always()
        run: |
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 build/demo/andryushka-arrow-demo.mp4 || echo 0)
          for t in $(seq 2 20 "${duration%.*}"); do
            if ffmpeg -loglevel error -y -ss "$t" -i build/demo/andryushka-arrow-demo.mp4 -frames:v 1 \
                 -vf scale=640:-2 -q:v 7 /tmp/frame.jpg; then
              echo "FRAME $t $(base64 -w0 /tmp/frame.jpg)"
            fi
          done

      - name: Журнал игры
        if: always()
        run: grep -E "ERROR|Exception|andryushka|Демо" build/demo/latest.log | head -200 || true

  # Ролик в релиз «review»: полный 720p и лёгкий 540p, чтобы его было удобно скачать и переслать.
  publish:
    needs: record
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: andryushka-arrow-demo
          path: demo

      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p dist
          cp demo/andryushka-arrow-demo.mp4 dist/andryushka-arrow-review-720p60.mp4
          # Лёгкая версия: 960×540, 60 кадров, около 1,6 Мбит/с.
          for pass in 1 2; do
            output=dist/andryushka-arrow-review-540p60.mp4; [ "$pass" = 1 ] && output=/dev/null
            ffmpeg -loglevel error -y -i demo/andryushka-arrow-demo.mp4 -vf scale=960:-2 -r 60 \
              -c:v libx264 -preset slow -b:v 1450k -pass "$pass" -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart -f mp4 "$output"
          done
          ls -l dist
          notes="Обзор мода «Стрела Андрюшки»: 60 кадров в секунду, звуки игры и закадровый голос (Silero TTS, CC BY-NC 4.0 — только для некоммерческого использования)."
          if gh release view review >/dev/null 2>&1; then
            gh release upload review dist/*.mp4 --clobber
          else
            gh release create review dist/*.mp4 --prerelease --target "$GITHUB_SHA" \
              --title "Обзор мода «Стрела Андрюшки»" --notes "$notes"
          fi
          for f in dist/*.mp4; do
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/review/$(basename "$f")"
          done
