plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

// Игровые тесты и демо-сценарий живут отдельно и в jar мода не попадают.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    demo {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
    }
}
// Классы и fabric.mod.json демо в одной папке: так Fabric видит его отдельным модом без группировки в loom.mods.
sourceSets.demo.output.resourcesDir = sourceSets.demo.java.destinationDirectory.get().asFile

loom {
    mods {
        'andryushka_arrow' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        'andryushka_arrow_gametest' {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // Игровые тесты на выделенном сервере: ./gradlew runGametest
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/report.xml"
            runDir 'build/gametest'
        }
        // Демонстрационный ролик: ./gradlew runDemo (игра сама создаёт мир и показывает стрелу)
        demo {
            client()
            name 'Demo'
            source sourceSets.demo
            vmArg '-Dandryushka.demo=true'
            programArgs '--width', '1280', '--height', '720'
            runDir 'run-demo'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
